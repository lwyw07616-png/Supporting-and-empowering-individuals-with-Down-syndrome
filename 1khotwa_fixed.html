<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خطوة | منصة تعليمية لتمكين ذوي متلازمة داون</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F9FF;--ink:#0F2A4A;--sub:#4B6280;--card:#fff;--line:#D5E4F3;--blue:#2563EB;--yel:#FBBF24;--grn:#10B981;--pur:#8B5CF6;--org:#F97316;--sky:#E0F2FE;--bad:#E57373;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1B2E;--ink:#EEF4FB;--sub:#A5B8CC;--card:#13304F;--line:#27496B;--sky:#173A5C}}
:root[data-theme="dark"]{--bg:#0B1B2E;--ink:#EEF4FB;--sub:#A5B8CC;--card:#13304F;--line:#27496B;--sky:#173A5C}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,sans-serif;font-size:18px;line-height:1.7}
h1,h2,h3{font-family:"Baloo Bhaijaan 2",Tajawal,Tahoma,sans-serif;line-height:1.3;margin:0}
.wrap{max-width:1000px;margin:0 auto;padding:0 18px 60px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 0;gap:10px}
header img{height:56px;border-radius:12px;cursor:pointer}
.pts{background:var(--yel);color:#0F2A4A;border-radius:14px;padding:4px 14px;font-weight:700;white-space:nowrap}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
.tabs button{flex:none;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 14px;font:500 16px Tajawal,sans-serif;color:var(--sub);cursor:pointer}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
:focus-visible{outline:3px solid var(--org);outline-offset:3px}
.btn{display:inline-block;background:var(--blue);color:#fff;border:0;border-radius:16px;padding:12px 24px;font:700 18px Tajawal,sans-serif;cursor:pointer;margin:4px}
.btn.alt{background:var(--yel);color:#0F2A4A}.btn.ghost{background:none;color:var(--ink);border:2px solid var(--line)}
h2{font-size:clamp(26px,4vw,36px);margin-bottom:6px}
.lead{color:var(--sub);max-width:56ch;margin:0 0 22px}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:10px;align-items:end;background:var(--sky);border-radius:28px;padding:24px 24px 0;overflow:hidden;margin-bottom:20px}
.hero h1{font-size:clamp(30px,5vw,46px);font-weight:800;color:var(--blue)}
.hero img{width:100%;max-width:260px;justify-self:center;display:block;mix-blend-mode:multiply}
.hero input,select{font:500 18px Tajawal,sans-serif;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
.today{display:inline-block;background:var(--card);border-radius:14px;padding:4px 14px;margin:8px 0;font-weight:700;cursor:pointer;border:2px solid var(--yel)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px}
.tile{border-radius:22px;padding:20px;text-align:right;font:inherit;border:0;cursor:pointer;color:#0F2A4A;min-height:150px}
.tile:hover{transform:translateY(-3px)}.tile b{display:block;font-size:44px}.tile h3{font-size:22px}.tile p{margin:2px 0 0;font-size:15px;line-height:1.5}
.t1{background:var(--blue);color:#fff}.t2{background:var(--yel)}.t3{background:var(--grn)}.t4{background:var(--pur);color:#fff}.t5{background:var(--org)}
.pa{background:#DBEAFE;color:#0F2A4A}.pb{background:#D1FAE5}.pc{background:#FEF3C7}.pd{background:#EDE9FE}.pe{background:#FFE4E6}
.stage{background:var(--sky);border-radius:28px;padding:26px;text-align:center;max-width:640px;margin:0 auto}
.vis{font-size:72px;line-height:1.2;min-height:100px;word-break:break-all}
.q{font:700 24px Tajawal,sans-serif;margin:6px 0 16px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.opt{background:var(--card);border:3px solid transparent;border-radius:18px;padding:14px;font:700 26px Tajawal,sans-serif;color:var(--ink);cursor:pointer;min-height:64px}
.opt.good{background:var(--grn);color:#0F2A4A}.opt.wrong{background:var(--bad);color:#fff}.opt.sel{opacity:.35}
.dot{display:inline-block;width:90px;height:90px;border-radius:50%}
.prog{font-weight:700;color:var(--sub);margin-bottom:6px}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:420px;margin:14px auto}
.card{aspect-ratio:1;border-radius:16px;border:0;background:var(--blue);color:#fff;font-size:38px;cursor:pointer}
.card.up{background:var(--card);color:var(--ink)}.card.ok{background:var(--grn)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:22px}
.bar{height:14px;background:var(--line);border-radius:9px;overflow:hidden;margin:4px 0 14px}
.bar span{display:block;height:100%;background:var(--grn);border-radius:9px;transition:width .5s}
.row{display:flex;justify-content:space-between;font-size:16px;gap:10px;align-items:center;margin-bottom:8px}
.list{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.list li{background:var(--bg);border-radius:12px;padding:8px 14px;display:flex;justify-content:space-between;font-size:16px;gap:8px}
textarea{width:100%;min-height:150px;font:16px Tajawal,sans-serif;border-radius:12px;border:2px solid var(--line);padding:10px;background:var(--bg);color:var(--ink)}
.big{font:800 40px "Baloo Bhaijaan 2",sans-serif}
.badge{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;text-align:center}
.badge.lock{filter:grayscale(1);opacity:.55}.badge b{display:block;font-size:42px}.badge p{margin:0;font-size:14px;color:var(--sub);line-height:1.4}
@media(max-width:760px){.two,.hero{grid-template-columns:1fr}.vis{font-size:56px}.hero img{max-width:200px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function lesson(id,i){
 L=LS.filter(function(x){return x.id===id})[0];i=i||0;var s=L.s[i],last=i===L.s.length-1;
 $("app").innerHTML='<div class="stage"><div class="prog">'+L.e+' '+L.t+' · الخطوة '+(i+1)+' من '+L.s.length+'</div><div class="vis">'+s[0]+'</div><div class="q">'+s[1]+'</div><p><button class="btn ghost" type="button" onclick="say(\''+s[1]+'\')">🔊 استمع</button></p>'+(i?'<button class="btn ghost" type="button" onclick="lesson(\''+id+'\','+(i-1)+')">السابق</button>':'')+'<button class="btn" type="button" id="nx">'+(last?"أنهيت الدرس ✅":"التالي")+'</button></div>';
 $("nx").onclick=function(){if(!last)return lesson(id,i+1);var p=S.done[id]?0:30;S.done[id]=1;S.pts+=p;lg(L.k,L.t);save();reward(3,p,L.k)};
 say(s[1])
}
var BG=[["🌱","الخطوة الأولى","أكمل أول نشاط",function(){return S.log.length>=1}],["🎯","خمسة أنشطة","أكمل 5 أنشطة",function(){return S.log.length>=5}],["⭐","100 نقطة","اجمع 100 نقطة",function(){return S.pts>=100}],["🏅","250 نقطة","اجمع 250 نقطة",function(){return S.pts>=250}],["🏆","500 نقطة","اجمع 500 نقطة",function(){return S.pts>=500}],["🧠","ذاكرة قوية","أنهِ لعبة الذاكرة",function(){return !!S.sk.memory}],["🏠","بطل الحياة","أنهِ كل دروس الحياة",function(){return pct("life")===100}],["💼","بطل العمل","أنهِ كل دروس العمل",function(){return pct("work")===100}]];
function ach(){$("app").innerHTML='<h2>إنجازاتي 🏆</h2><p class="lead">'+BG.filter(function(b){return b[3]()}).length+' من '+BG.length+' أوسمة. أكمل لتفتح الباقي!</p><div class="grid">'+BG.map(function(b){return'<div class="badge'+(b[3]()?"":" lock")+'"><b>'+b[0]+'</b><h3>'+b[1]+'</h3><p>'+b[2]+'</p></div>'}).join("")+'</div>'}
function bars(){return Object.keys(AR).map(function(k){return'<div class="row"><span>'+AR[k][0]+' '+AR[k][1]+'</span><b>'+pct(k)+'%</b></div><div class="bar"><span style="width:'+pct(k)+'%"></span></div>'}).join("")}
function avg(){var k=Object.keys(AR);return Math.round(k.reduce(function(a,x){return a+pct(x)},0)/k.length)}
function parentV(){
 var h='<h2>لوحة متابعة الأسرة</h2><p class="lead">تقدّم '+nm()+' في كل مهارة. البيانات محفوظة على هذا الجهاز.</p><div class="two"><div class="panel"><div class="row"><span>اسم الطفل</span><input id="pn" value="'+esc(S.name)+'" aria-label="اسم الطفل"></div><button class="btn alt" type="button" onclick="S.name=$(\'pn\').value.trim();save();parentV()">حفظ</button><p class="row"><span>مستوى التقدم الكلي</span><span class="big">'+avg()+'%</span></p><p class="row"><span>النقاط · المستوى</span><b>'+S.pts+' · '+LV[lvl()][1]+'</b></p>'+bars()+'</div><div class="panel"><h3>آخر الأنشطة</h3><br><ul class="list">';
 h+=S.log.length?S.log.slice(0,8).map(function(l){return'<li><span>'+AR[l.a][0]+' '+AR[l.a][1]+' · '+l.s+'</span><span>'+l.d+'</span></li>'}).join(""):'<li>لا توجد أنشطة بعد</li>';
 $("app").innerHTML=h+'</ul><br><button class="btn ghost" type="button" onclick="if(confirm(\'مسح كل البيانات؟\')){S={name:\'\',pts:0,sk:{},log:[],plan:{},done:{}};save();go(\'parent\')}">مسح البيانات</button></div></div>'
}
function report(){var t="تقرير تقدّم "+(S.name||"الطفل")+" ("+dt()+")\nالنقاط: "+S.pts+" · المستوى: "+LV[lvl()][1]+"\nالتقدم الكلي: "+avg()+"%\n";Object.keys(AR).forEach(function(k){t+="- "+AR[k][1]+": "+pct(k)+"%\n"});return t+"الأنشطة المسجّلة: "+S.log.length}
function teacher(){
 var h='<h2>قسم المعلم</h2><p class="lead">حدّد نشاطًا لكل يوم ليظهر في الصفحة الرئيسية للطفل، وانسخ التقرير لأولياء الأمور.</p><div class="two"><div class="panel"><h3>الخطة الأسبوعية</h3><br>';
 DAYS.forEach(function(d,i){h+='<div class="row"><span>'+d+'</span><select data-d="'+i+'" aria-label="'+d+'"><option value="">—</option>'+Object.keys(AR).map(function(k){return'<option value="'+k+'"'+(S.plan[i]===k?" selected":"")+'>'+AR[k][1]+'</option>'}).join("")+'</select></div>'});
 h+='</div><div class="panel"><h3>تقرير التقدم</h3><br><textarea id="rp" readonly>'+esc(report())+'</textarea><p><button class="btn alt" type="button" id="cp">نسخ التقرير</button> <span id="cm"></span></p><h3>تجربة الأنشطة</h3><br>';
 Object.keys(AR).forEach(function(k){h+='<button class="btn ghost" type="button" onclick="op(\''+k+'\')">'+AR[k][0]+' '+AR[k][1]+'</button>'});
 $("app").innerHTML=h+'</div></div>';
 document.querySelectorAll("select[data-d]").forEach(function(s){s.onchange=function(){S.plan[s.dataset.d]=s.value;save()}});
 $("cp").onclick=function(){var r=$("rp");r.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}$("cm").textContent=ok?"تم النسخ":"حدّد النص وانسخه يدويًا"}
}
go("home");
</script>
</body>
</html>
